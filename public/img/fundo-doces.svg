<svg xmlns="http://www.w3.org/2000/svg" width="260" height="260" viewBox="0 0 260 260">
  <!-- Fundo do site dos clientes: doces em traço fino, repetidos como papel de parede.
       Tudo fica longe das bordas para o encaixe entre os quadrinhos não cortar desenho. -->
  <g fill="none" stroke="#B9875C" stroke-opacity="0.22" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">

    <!-- cupcake -->
    <g transform="translate(18 16) rotate(-10 14 18)">
      <path d="M3 16 L7 33 H21 L25 16"/>
      <path d="M11 17 L12 32 M17 17 L16 32"/>
      <path d="M0 16 C0 10 5 8 8 9 C9 3 19 3 20 9 C23 8 28 10 28 16 Z"/>
      <circle cx="14" cy="1.5" r="2.5"/>
    </g>

    <!-- pudim -->
    <g transform="translate(146 18)">
      <ellipse cx="17" cy="27" rx="18" ry="4"/>
      <path d="M5 25 L9 9 Q17 5 25 9 L29 25"/>
      <ellipse cx="17" cy="9" rx="8" ry="2.5"/>
      <path d="M11 10 Q10 15 13 15 M22 10 Q24 14 21 15"/>
    </g>

    <!-- estrelinha -->
    <path transform="translate(96 30) rotate(12 8 8)" d="M8 0 L10 6 L16 6 L11 10 L13 16 L8 12 L3 16 L5 10 L0 6 L6 6 Z"/>

    <!-- granulado -->
    <path d="M214 34 l6 3 M224 22 l2 6 M206 50 l5 -3 M226 52 l-3 5"/>

    <!-- donut -->
    <g transform="translate(26 102)">
      <circle cx="14" cy="14" r="14"/>
      <circle cx="14" cy="14" r="5"/>
      <path d="M5 9 l3 2 M21 5 l-1 3 M23 18 l-3 1 M9 22 l2 -2 M15 2 l1 3"/>
    </g>

    <!-- brownie -->
    <g transform="translate(96 96) rotate(-6 16 15)">
      <path d="M2 10 L16 4 L30 10 L16 16 Z"/>
      <path d="M2 10 V20 L16 26 V16 M30 10 V20 L16 26"/>
      <path d="M10 9 q3 -1 5 1 M18 7 q3 -1 5 1"/>
    </g>

    <!-- bolo no pote -->
    <g transform="translate(192 92) rotate(8 14 18)">
      <rect x="0" y="0" width="28" height="6" rx="2"/>
      <path d="M2 6 H26 L24 32 H4 Z"/>
      <path d="M3 15 Q8 13 14 15 T25 15 M3.6 23 Q8 21 14 23 T24.4 23"/>
    </g>

    <!-- coração -->
    <path transform="translate(150 70) rotate(-14 12 12)" d="M12 22 C2 15 0 9 4 5 C7 2 11 3 12 7 C13 3 17 2 20 5 C24 9 22 15 12 22 Z"/>

    <!-- pirulito -->
    <g transform="translate(132 156) rotate(16 10 18)">
      <circle cx="10" cy="10" r="9"/>
      <path d="M10 10 m-4 0 a4 4 0 1 0 4 -4 a6.5 6.5 0 1 0 6.5 6.5"/>
      <path d="M10 19 V36"/>
    </g>

    <!-- coração pequeno -->
    <path transform="translate(70 160) scale(0.7)" d="M12 22 C2 15 0 9 4 5 C7 2 11 3 12 7 C13 3 17 2 20 5 C24 9 22 15 12 22 Z"/>

    <!-- colher -->
    <g transform="translate(214 168) rotate(28 6 18)">
      <ellipse cx="6" cy="7" rx="5" ry="7"/>
      <path d="M6 14 V36"/>
    </g>

    <!-- cupcake pequeno -->
    <g transform="translate(30 196) rotate(10 11 14) scale(0.8)">
      <path d="M3 16 L7 33 H21 L25 16"/>
      <path d="M0 16 C0 10 5 8 8 9 C9 3 19 3 20 9 C23 8 28 10 28 16 Z"/>
      <circle cx="14" cy="1.5" r="2.5"/>
    </g>

    <!-- estrelinha pequena e granulado -->
    <path transform="translate(182 222) scale(0.7)" d="M8 0 L10 6 L16 6 L11 10 L13 16 L8 12 L3 16 L5 10 L0 6 L6 6 Z"/>
    <path d="M96 214 l5 3 M108 206 l1 5 M92 232 l5 -2 M84 70 l4 3 M60 58 l1 5 M240 132 l-4 4"/>
    <circle cx="120" cy="128" r="1.6"/>
    <circle cx="70" cy="128" r="1.6"/>
    <circle cx="240" cy="236" r="1.6"/>
  </g>
</svg>
